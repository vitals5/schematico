name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      cancel_deployment:
        description: Optional full commit SHA of a stuck Pages deployment to cancel before publishing
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Cancel explicitly selected stale Pages deployment
        if: github.event_name == 'workflow_dispatch' && inputs.cancel_deployment != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_DEPLOYMENT: ${{ inputs.cancel_deployment }}
        run: |
          if [[ ! "$PAGES_DEPLOYMENT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Expected a full deployment commit SHA."
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${PAGES_DEPLOYMENT}/cancel" --silent

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: './dist'

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            if count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq "[.artifacts[] | select(.name == \"$PAGES_ARTIFACT\" and .expired == false)] | length"); then
              if [[ "$count" == "1" ]]; then
                echo "Pages artifact metadata is available."
                exit 0
              fi
              if [[ "$count" != "0" ]]; then
                echo "Expected exactly one Pages artifact for this run attempt."
                exit 1
              fi
            fi
            if [[ "$attempt" != "12" ]]; then sleep 5; fi
          done
          echo "Pages artifact metadata is still unavailable. Retry the workflow."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
