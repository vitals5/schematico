name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      cancel_deployment:
        description: Optional full commit SHA of a stuck Pages deployment to cancel before publishing
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Cancel explicitly selected stale Pages deployment
        if: github.event_name == 'workflow_dispatch' && inputs.cancel_deployment != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_DEPLOYMENT: ${{ inputs.cancel_deployment }}
        run: |
          if [[ ! "$PAGES_DEPLOYMENT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Expected a full deployment commit SHA."
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${PAGES_DEPLOYMENT}/cancel" --silent

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
